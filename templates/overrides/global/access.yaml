# Начальная глобальная политика оставляет Sentry выключенным до явного opt-in пользователя.
version: 1
mcp:
  # Пустой allow оставляет доступным базовый список MCP.
  allow: []
  # Sentry опционален; команда `agent-kit mcp enable sentry` удалит его из block.
  block: [sentry]
skills:
  # Пустой allow оставляет доступными базовые skills.
  allow: []
  # В block перечисляют ID skills, которые нужно отключить локально.
  block: []
