# Нейтральная глобальная политика не ограничивает компоненты, пока списки пусты.
version: 1
mcp:
  # Пустой allow оставляет доступным базовый список MCP.
  allow: []
  # В block перечисляют ID MCP, которые нужно отключить локально.
  block: []
skills:
  # Пустой allow оставляет доступными базовые skills.
  allow: []
  # В block перечисляют ID skills, которые нужно отключить локально.
  block: []
