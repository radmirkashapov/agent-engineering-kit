# Пример политики показывает, как локально отключить выбранные MCP и skills.
version: 1
mcp:
  # Добавьте в allow ID MCP, если хотите разрешить только перечисленные компоненты.
  allow: []
  # Добавьте в block ID MCP, которые должны быть отключены.
  block: []
skills:
  # Добавьте в allow ID skills, если хотите разрешить только перечисленные компоненты.
  allow: []
  # Добавьте в block ID skills, которые должны быть отключены.
  block: []
