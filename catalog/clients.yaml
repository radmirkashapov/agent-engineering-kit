# Желаемые способы подключения kit к каждому поддерживаемому AI-клиенту.
version: 1
clients:
  # Каждый блок фиксирует нативные точки инструкций, skills и MCP клиента.
  - id: codex
    instructions: ~/.codex/AGENTS.md
    skills: ~/.agents/skills
    mcp: ~/.codex/config.toml
  - id: claude-code
    instructions: ~/.claude/CLAUDE.md
    skills: ~/.claude/skills
    mcp: ~/.claude.json
  - id: claude-desktop
    instructions: ограничены-возможностями-клиента
    skills: extensions/plugins
    mcp: claude_desktop_config.json
  - id: opencode
    instructions: AGENTS.md
    skills: ~/.agents/skills
    mcp: opencode.json
  - id: cline
    instructions: AGENTS.md и Cline Rules
    skills: зависят-от-клиента
    mcp: cline_mcp_settings.json
