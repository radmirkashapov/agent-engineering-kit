# Desired state MCP: core servers включены всегда, остальные — по сигналам проекта.
version: 1
servers:
  # Core: code graph и анализ архитектурного impact.
  - id: codebase-memory
    description: Build and query a code knowledge graph for architecture and change-impact analysis
    category: core
    required: true
    transport: stdio
    activation: always
    command: codebase-memory-mcp
    source:
      type: git
      repository: https://github.com/DeusData/codebase-memory-mcp.git
    installation:
      type: pinned-release-installer
      scripts:
        posix: install.sh
        windows: install.ps1
      download_base: https://github.com/DeusData/codebase-memory-mcp/releases/download/{version}
    state: native
    policy: locked

  # Core: поиск symbols, references и semantic refactoring.
  - id: serena
    description: Navigate symbols and references with semantic code analysis and editing tools
    category: core
    required: true
    transport: stdio
    activation: always
    command: serena
    args: [start-mcp-server, --project-from-cwd, --context, codex]
    source:
      type: git
      repository: https://github.com/oraios/serena.git
    installation:
      type: uv-tool
      python: "3.13"
      requirement: serena-agent @ git+https://github.com/oraios/serena.git@{revision}
    state: native
    policy: locked

  # Core: актуальная внешняя документация через remote OAuth endpoint.
  - id: context7
    description: Retrieve current library, framework, and API documentation from authoritative sources
    category: core
    required: true
    transport: http
    activation: always
    source:
      type: git
      repository: https://github.com/upstash/context7.git
    installation:
      type: remote
      endpoint: https://mcp.context7.com/mcp/oauth
      authentication: oauth
    state: stateless
    policy: locked

  # Conditional SCM integrations активируются по remotes logical project.
  - id: github
    description: Access GitHub repositories, issues, pull requests, and related source-control workflows
    category: scm
    required: false
    transport: stdio
    activation: github
    command: docker
    args: [run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, "ghcr.io/github/github-mcp-server@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6"]
    source:
      type: git
      repository: https://github.com/github/github-mcp-server.git
    installation:
      type: external-command
      command: docker
      image: ghcr.io/github/github-mcp-server@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: env:GITHUB_PERSONAL_ACCESS_TOKEN
    state: native
    policy: configurable

  - id: gitlab
    description: Access GitLab projects, merge requests, issues, and related source-control workflows
    category: scm
    required: false
    transport: http
    activation: gitlab
    source:
      type: git
      repository: https://github.com/gitlabhq/gitlabhq.git
    installation:
      type: remote
      endpoint: https://gitlab.com/api/v4/mcp
      authentication: oauth
    state: native
    policy: configurable

  # Conditional quality integrations включаются только при соответствующем project signal.
  - id: sonarqube
    description: Inspect SonarQube findings, quality gates, and static-analysis results for the project
    category: quality
    required: false
    transport: stdio
    activation: sonar
    command: docker
    args: [run, -i, --rm, -e, SONARQUBE_TOKEN, "sonarsource/sonarqube-mcp@sha256:25e9eabc440515651ae62e0dc8382ca2c41d243c2aca68759ddd721825d408bd"]
    source:
      type: git
      repository: https://github.com/SonarSource/sonarqube-mcp-server.git
    installation:
      type: external-command
      command: docker
      image: sonarsource/sonarqube-mcp@sha256:25e9eabc440515651ae62e0dc8382ca2c41d243c2aca68759ddd721825d408bd
    environment:
      SONARQUBE_TOKEN: env:SONARQUBE_TOKEN
    state: native
    policy: configurable

  - id: playwright
    description: Automate browser interactions and verify user-visible behavior in web applications
    category: quality
    required: false
    transport: stdio
    activation: web
    command: npx
    args: [-y, "@playwright/mcp@0.0.47"]
    source:
      type: git
      repository: https://github.com/microsoft/playwright-mcp.git
    installation:
      type: external-command
      command: npx
    state: native
    policy: configurable

  # Collaboration integration требует настроенного Atlassian tenant и OAuth.
  - id: atlassian
    description: Access Jira and Confluence project context through the official Atlassian integration
    category: collaboration
    required: false
    transport: http
    activation: atlassian
    source:
      type: service
      repository: https://developer.atlassian.com/cloud/rovo-mcp/
    installation:
      type: remote
      endpoint: https://mcp.atlassian.com/v2/mcp
      authentication: oauth
    state: native
    policy: configurable
