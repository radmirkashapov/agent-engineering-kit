# Корпоративный allowlist определяет переносимые model dependencies repository.
version: 1
# По умолчанию корпоративное ограничение выключено; fork может включить его и изменить allowlist.
enabled: false

# Реестр provider нужен для проверки опечаток и неявного vendor coupling.
providers:
  - id: openai
    name: OpenAI
    description: OpenAI-hosted models and compatible gateways.
  - id: anthropic
    name: Anthropic
    description: Anthropic-hosted models for native Claude clients.
  - id: ollama
    name: Ollama
    description: Locally hosted models discovered through Ollama.
  - id: custom
    name: Custom provider
    description: A provider declared by the local user or corporate fork.

# Корпоративно разрешённые модели для committed definitions.
models:
  - id: gpt-5.6-sol
    provider: openai
    name: GPT-5.6 Sol
    description: Default coding model in the example policy.
    aliases:
      - primary-coding
    capabilities:
      reasoning: true
      coding: true
      tool_use: true
      long_context: true

  - id: claude-opus-4.6
    provider: anthropic
    name: Claude Opus 4.6
    description: Default review model in the example policy.
    aliases:
      - primary-review
    capabilities:
      reasoning: true
      coding: true
      tool_use: true
      long_context: true
