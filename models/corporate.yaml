# Корпоративный allowlist определяет переносимые model dependencies repository.
version: 1
# По умолчанию корпоративное ограничение выключено; fork может включить его и изменить allowlist.
enabled: false

# Реестр provider нужен для проверки опечаток и неявного vendor coupling.
providers:
  - id: openai
  - id: anthropic
  - id: ollama
  - id: custom

# Корпоративно разрешённые модели для committed definitions.
models:
  - id: gpt-5.6-sol
    provider: openai
    aliases:
      - primary-coding
    capabilities:
      reasoning: true
      coding: true
      tool_use: true
      long_context: true

  - id: claude-opus-4.6
    provider: anthropic
    aliases:
      - primary-review
    capabilities:
      reasoning: true
      coding: true
      tool_use: true
      long_context: true
