# CI проверяет корпоративную конфигурацию и тесты на поддерживаемых версиях Python.
name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Единственная job воспроизводит обязательные проверки перед merge.
  test:
    runs-on: ubuntu-latest
    env:
      AGENT_KIT_DATA_HOME: ${{ runner.temp }}/agent-kit-data
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Установить закреплённый Gitleaks
        run: |
          mkdir -p "$AGENT_KIT_DATA_HOME/installations/security/gitleaks/bin"
          GOBIN="$AGENT_KIT_DATA_HOME/installations/security/gitleaks/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Установить package и test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Проверить corporate baseline без local overrides
        run: agent-kit validate --ci
      - name: Запустить tests
        run: pytest
