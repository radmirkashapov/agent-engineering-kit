name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установить package и test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Проверить corporate baseline без local overrides
        run: agent-kit validate --ci
      - name: Запустить tests
        run: pytest
